server.port=4000

spring.data.rest.base-path=api
spring.main.banner-mode=off
spring.jpa.properties.hibernate.format_sql=true

# GraphQL servlet CORS - nginx strips these headers via proxy_hide_header to avoid duplicates
graphql.servlet.cors.enabled=true
graphql.servlet.cors.allowed-origins=*
graphql.servlet.cors.allowed-methods=GET,POST,OPTIONS
graphql.servlet.cors.allowed-headers=Authorization,Content-Type,Accept
graphql.servlet.cors.max-age=3600

# GitHub API Settings
github.api.url=${GITHUB_API_URL}
github.api.token=${GITHUB_API_TOKEN}
github.user.name=${GITHUB_API_NAME}

# Scheduler in Spring
spring.task.scheduling.pool.size=2

# by docker images
articles.path=/app/content/articles

# Path to store downloaded project OG images
projects.images.path=${PROJECTS_IMAGES_PATH:/app/content/images/projects}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%clr(%d{yy-MM-dd E HH:mm:ss.SSS}){yellow} %clr(%-5p) %clr(%logger{0}){blue} %clr(%m){faint}%n

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:9001}
