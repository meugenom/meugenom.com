<!doctype html>
<html lang="en">

<head>
    <link rel="shortcut icon" type="image/x-icon" href="favicon/favicon.ico" />
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="description"
        content="Meugenom is a personal blog about embedded, software development and programming.">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>meugenom.com</title>
    <!-- 1. DEFAULT DISALLOW (before loading GA4) -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

        const savedConsent = localStorage.getItem('google_analytics_consent');
        const initialAnalyticsStatus = (savedConsent === 'granted') ? 'granted' : 'denied';

        gtag('consent', 'default', {
            'analytics_storage': initialAnalyticsStatus,
            'ad_storage': initialAnalyticsStatus,
            'ad_user_data': initialAnalyticsStatus,
            'ad_personalization': initialAnalyticsStatus
        });
    </script>

    <!-- 2. LOADING GOOGLE ANALYTICS (Change your G-XXXXXXXXXX) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCGMG1CWW0"></script>
    <script>
        gtag('js', new Date());
        gtag('config', 'G-SCGMG1CWW0');
    </script>
</head>

<body>

    <header id="header"></header>
    <div id="content">
    </div>
    <footer id="footer"></footer>
    <!-- Banner and button's logic (in the bottom of the page) -->
    <div id="ga-consent-banner"
        style="position: fixed; bottom: 20px; right: 20px; background: #fff; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 10px ;z-index: 9999; display: none;">
        <p style="margin: 0 0 15px 0; font-family: sans-serif; font-size: 16px; font-weight: bold;">Ihre Privatsphäre ist für uns wichtig</p>
        <p style="margin: 0 0 10px 0; font-family: sans-serif; font-size: 14px;">Bei der Nutzung dieser Website verwenden wir Cookes, um:</p>
        <p style="margin: 0 0 6px 0; font-family: sans-serif;font-size: 14px;">- diese Webseite bereitzustellen</p>
        <p style="margin: 0 0 6px 0; font-family: sans-serif;font-size: 14px;">- Sichercheitsmaßnahmen anzuwenden, Spam und Missbrauch zu verhindern</p>
        <p style="margin: 0 0 6px 0; font-family: sans-serif; font-size: 14px;">- Ihre Nutzung unserer Webseite zu messen</p>
        <button id="consent-yes-btn"
            style="background: oklch(83.7% 0.128 66.29); color: white; border: none; padding: 8px 15px; cursor: pointer; margin-right: 10px; border-radius: 20px;">Alle akzeptieren</button>
        <button id="consent-no-btn"
            style="background: oklch(80.8% 0.114 19.571); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 20px;">Alle ablehnen</button>
    </div>

    <script>
        // DOM is built and script starts
        const banner = document.getElementById('ga-consent-banner');
        const yesBtn = document.getElementById('consent-yes-btn');
        const noBtn = document.getElementById('consent-no-btn');
        const savedConsentStatus = localStorage.getItem('google_analytics_consent');

        if (!savedConsentStatus) {
            banner.style.display = 'block';
        }

        yesBtn.addEventListener('click', () => {
            gtag('consent', 'update', {
                'analytics_storage': 'granted',
                'ad_storage': 'granted',
                'ad_user_data': 'granted',
                'ad_personalization': 'granted'
            });
            localStorage.setItem('google_analytics_consent', 'granted');
            banner.style.display = 'none';
        });

        noBtn.addEventListener('click', () => {
            gtag('consent', 'update', {
                'analytics_storage': 'denied',
                'ad_storage': 'denied',
                'ad_user_data': 'denied',
                'ad_personalization': 'denied'
            });
            localStorage.setItem('google_analytics_consent', 'denied');
            banner.style.display = 'none';
        });
    </script>
</body>

</html>
